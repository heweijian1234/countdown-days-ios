name: CountdownDays
options:
  bundleIdPrefix: com.zeronelabs
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "FZYVPK6336"
    CODE_SIGN_STYLE: Automatic

targets:
  CountdownDays:
    type: application
    platform: iOS
    sources:
      - path: CountdownDays
      - path: Shared
    dependencies:
      - target: CountdownWidget
    info:
      path: CountdownDays/Info.plist
      properties:
        CFBundleDisplayName: 倒数日
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: CountdownDays/CountdownDays.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zeronelabs.countdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeronelabs.countdowndays
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  CountdownWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CountdownWidget
      - path: Shared
    info:
      path: CountdownWidget/Info.plist
      properties:
        CFBundleDisplayName: 倒数小组件
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CountdownWidget/CountdownWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zeronelabs.countdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeronelabs.countdowndays.widget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  CountdownDays:
    build:
      targets:
        CountdownDays: all
    run:
      config: Debug
    archive:
      config: Release
